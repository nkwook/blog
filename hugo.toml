baseURL = 'https://nkwook.github.io/blog/'
languageCode = 'ko'
title = '개발명가'
theme = 'PaperMod'
enableRobotsTXT = true
[pagination]
  pagerSize = 10

[params]
  mainSections = ["posts", "macro-study"]
  env = "production"
  defaultTheme = "auto"
  showReadingTime = true
  showShareButtons = false
  showPostNavLinks = true
  showBreadCrumbs = true
  showCodeCopyButtons = true
  DateFormat = "2006-01-02"
  description = "AI·개발과 투자 공부를 기록하는 블로그"
  author = "nkwook"
  keywords = ["AI", "LLM", "개발", "투자", "반도체", "산업 리서치"]

  [params.homeInfoParams]
    Title = "개발명가"
    Content = "AI·개발과 투자 공부를 기록하는 블로그. 산업 리서치, 시장 메모, 공부 노트를 올립니다."

[menu]
  [[menu.main]]
    identifier = "investing"
    name = "투자"
    url = "/categories/investing/"
    weight = 10
  [[menu.main]]
    identifier = "study"
    name = "공부 노트"
    url = "/categories/study/"
    weight = 20
  [[menu.main]]
    identifier = "ai-dev"
    name = "AI·개발"
    url = "/categories/ai-dev/"
    weight = 30
  [[menu.main]]
    identifier = "archives"
    name = "Archives"
    url = "/archives/"
    weight = 40
  [[menu.main]]
    identifier = "tags"
    name = "Tags"
    url = "/tags/"
    weight = 50
  [[menu.main]]
    identifier = "search"
    name = "검색"
    url = "/search/"
    weight = 60

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = false
    style = "monokai"
