<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">
<style>
.t{font-size:19px;font-weight:700;fill:#111827}.s{font-size:13px;fill:#6b7280}.l{font-size:14px;fill:#1f2937}.b{font-weight:700}.sm{font-size:12.5px;fill:#4b5563}.o{font-size:12.5px;fill:#c2410c}.n{font-size:13px;font-weight:700;fill:#fff}
</style>
<defs>
<marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f97316"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker>
</defs>
<rect width="800" height="500" rx="14" fill="#ffffff"/>
<text x="400" y="34" text-anchor="middle" class="t">위에서 내려다본 화면 있는 글래스</text>
<text x="400" y="56" text-anchor="middle" class="s">오른쪽 눈에만 화면이 있는 단안형 예시 (Meta Ray-Ban Display 와 같은 구조)</text>

<text x="24" y="92" class="sm">바깥 세상</text>
<text x="24" y="360" class="sm">얼굴 쪽</text>

<!-- scenery -->
<line x1="230" y1="72" x2="230" y2="272" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ag)"/>
<line x1="505" y1="72" x2="505" y2="272" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ag)"/>
<text x="240" y="88" class="sm">바깥 풍경은 렌즈를 그대로 통과해 보인다</text>

<!-- frame -->
<rect x="82" y="110" width="18" height="250" rx="4" fill="#94a3b8"/>
<rect x="100" y="110" width="260" height="34" rx="4" fill="#f1f5f9" stroke="#94a3b8"/>
<rect x="360" y="119" width="70" height="14" rx="3" fill="#64748b"/>
<rect x="430" y="110" width="230" height="34" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<rect x="722" y="160" width="18" height="200" rx="4" fill="#94a3b8"/>
<text x="712" y="352" text-anchor="end" class="sm">안경다리</text>

<!-- module -->
<rect x="660" y="100" width="80" height="60" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<rect x="716" y="111" width="12" height="38" rx="2" fill="#1f2937"/>
<ellipse cx="690" cy="130" rx="7" ry="18" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5"/>

<!-- light -->
<line x1="715" y1="130" x2="699" y2="130" stroke="#f97316" stroke-width="2.5"/>
<polyline points="682,128 660,127 640,141 620,113 600,141 580,113 560,141 548,128" fill="none" stroke="#f97316" stroke-width="2.5" stroke-linejoin="round"/>
<line x1="545" y1="146" x2="545" y2="270" stroke="#f97316" stroke-width="3" marker-end="url(#ao)"/>
<text x="558" y="164" class="o">유리 안에서</text><text x="558" y="181" class="o">반사하며 이동</text>
<text x="556" y="222" class="o">눈 쪽으로 꺼냄</text>

<!-- eyes -->
<ellipse cx="230" cy="300" rx="34" ry="19" fill="#fff" stroke="#475569" stroke-width="1.5"/>
<circle cx="230" cy="300" r="9" fill="#334155"/>
<ellipse cx="545" cy="300" rx="34" ry="19" fill="#fff" stroke="#475569" stroke-width="1.5"/>
<circle cx="545" cy="300" r="9" fill="#334155"/>
<text x="230" y="338" text-anchor="middle" class="l">왼쪽 눈 (화면 없음)</text>
<text x="545" y="338" text-anchor="middle" class="l">오른쪽 눈</text>

<!-- badges -->
<circle cx="722" cy="86" r="11" fill="#1f2937"/><text x="722" y="91" text-anchor="middle" class="n">1</text>
<circle cx="690" cy="86" r="11" fill="#1f2937"/><text x="690" y="91" text-anchor="middle" class="n">2</text>
<circle cx="612" cy="96" r="11" fill="#2563eb"/><text x="612" y="101" text-anchor="middle" class="n">3</text>

<!-- legend -->
<g transform="translate(24,384)">
<rect width="240" height="92" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
<circle cx="22" cy="24" r="11" fill="#1f2937"/><text x="22" y="29" text-anchor="middle" class="n">1</text>
<text x="42" y="29" class="l b">microdisplay</text>
<text x="16" y="56" class="sm">손톱보다 작은 화면.</text>
<text x="16" y="76" class="sm">이미지를 만든다.</text>
</g>
<g transform="translate(280,384)">
<rect width="240" height="92" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
<circle cx="22" cy="24" r="11" fill="#1f2937"/><text x="22" y="29" text-anchor="middle" class="n">2</text>
<text x="42" y="29" class="l b">광학 엔진</text>
<text x="16" y="56" class="sm">빛을 모아 waveguide 입구에</text>
<text x="16" y="76" class="sm">정확한 각도로 넣는다.</text>
</g>
<g transform="translate(536,384)">
<rect width="240" height="92" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
<circle cx="22" cy="24" r="11" fill="#2563eb"/><text x="22" y="29" text-anchor="middle" class="n">3</text>
<text x="42" y="29" class="l b">waveguide</text>
<text x="16" y="56" class="sm">렌즈 속 얇은 유리판. 빛을</text>
<text x="16" y="76" class="sm">눈앞까지 옮겨 눈 쪽으로 꺼낸다.</text>
</g>
</svg>
