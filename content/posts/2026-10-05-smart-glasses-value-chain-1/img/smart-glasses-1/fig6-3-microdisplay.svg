<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">
<style>.t{font-size:19px;font-weight:700;fill:#111827}.s{font-size:13px;fill:#6b7280}.l{font-size:14px;fill:#1f2937}.b{font-weight:700}.sm{font-size:12.5px;fill:#4b5563}</style>
<rect width="800" height="400" rx="14" fill="#ffffff"/>
<text x="400" y="34" text-anchor="middle" class="t">microdisplay 의 구조: 반도체 칩 위에 화면을 올린다</text>
<text x="400" y="56" text-anchor="middle" class="s">옆에서 자른 단면. 전체 크기는 손톱보다 작다.</text>
<rect x="60" y="146" width="360" height="42" rx="3" fill="#f8fafc" stroke="#94a3b8"/>
<rect x="70" y="150" width="18" height="34" rx="2" fill="#fde68a"/><rect x="92" y="150" width="18" height="34" rx="2" fill="#86efac"/><rect x="114" y="150" width="18" height="34" rx="2" fill="#fde68a"/><rect x="136" y="150" width="18" height="34" rx="2" fill="#93c5fd"/><rect x="158" y="150" width="18" height="34" rx="2" fill="#fca5a5"/><rect x="180" y="150" width="18" height="34" rx="2" fill="#86efac"/><rect x="202" y="150" width="18" height="34" rx="2" fill="#fde68a"/><rect x="224" y="150" width="18" height="34" rx="2" fill="#93c5fd"/><rect x="246" y="150" width="18" height="34" rx="2" fill="#fca5a5"/><rect x="268" y="150" width="18" height="34" rx="2" fill="#86efac"/><rect x="290" y="150" width="18" height="34" rx="2" fill="#fde68a"/><rect x="312" y="150" width="18" height="34" rx="2" fill="#93c5fd"/><rect x="334" y="150" width="18" height="34" rx="2" fill="#fca5a5"/><rect x="356" y="150" width="18" height="34" rx="2" fill="#86efac"/><rect x="378" y="150" width="18" height="34" rx="2" fill="#fde68a"/><rect x="400" y="150" width="18" height="34" rx="2" fill="#93c5fd"/>
<rect x="60" y="188" width="360" height="62" rx="3" fill="#cbd5e1" stroke="#64748b"/>
<rect x="76" y="200" width="8" height="8" fill="#475569"/><line x1="80" y1="186" x2="80" y2="200" stroke="#475569" stroke-width="1.2"/><rect x="98" y="200" width="8" height="8" fill="#475569"/><line x1="102" y1="186" x2="102" y2="200" stroke="#475569" stroke-width="1.2"/><rect x="120" y="200" width="8" height="8" fill="#475569"/><line x1="124" y1="186" x2="124" y2="200" stroke="#475569" stroke-width="1.2"/><rect x="142" y="200" width="8" height="8" fill="#475569"/><line x1="146" y1="186" x2="146" y2="200" stroke="#475569" stroke-width="1.2"/><rect x="164" y="200" width="8" height="8" fill="#475569"/><line x1="168" y1="186" x2="168" y2="200" stroke="#475569" stroke-width="1.2"/><rect x="186" y="200" width="8" height="8" fill="#475569"/><line x1="190" y1="186" x2="190" y2="200" stroke="#475569" stroke-width="1.2"/><rect x="208" y="200" width="8" height="8" fill="#475569"/><line x1="212" y1="186" x2="212" y2="200" stroke="#475569" stroke-width="1.2"/><rect x="230" y="200" width="8" height="8" fill="#475569"/><line x1="234" y1="186" x2="234" y2="200" stroke="#475569" stroke-width="1.2"/><rect x="252" y="200" width="8" height="8" fill="#475569"/><line x1="256" y1="186" x2="256" y2="200" stroke="#475569" stroke-width="1.2"/><rect x="274" y="200" width="8" height="8" fill="#475569"/><line x1="278" y1="186" x2="278" y2="200" stroke="#475569" stroke-width="1.2"/><rect x="296" y="200" width="8" height="8" fill="#475569"/><line x1="300" y1="186" x2="300" y2="200" stroke="#475569" stroke-width="1.2"/><rect x="318" y="200" width="8" height="8" fill="#475569"/><line x1="322" y1="186" x2="322" y2="200" stroke="#475569" stroke-width="1.2"/><rect x="340" y="200" width="8" height="8" fill="#475569"/><line x1="344" y1="186" x2="344" y2="200" stroke="#475569" stroke-width="1.2"/><rect x="362" y="200" width="8" height="8" fill="#475569"/><line x1="366" y1="186" x2="366" y2="200" stroke="#475569" stroke-width="1.2"/><rect x="384" y="200" width="8" height="8" fill="#475569"/><line x1="388" y1="186" x2="388" y2="200" stroke="#475569" stroke-width="1.2"/><rect x="406" y="200" width="8" height="8" fill="#475569"/><line x1="410" y1="186" x2="410" y2="200" stroke="#475569" stroke-width="1.2"/>
<text x="240" y="236" text-anchor="middle" class="sm">화소 하나마다 켜고 끄는 회로가 붙어 있다</text>
<text x="60" y="132" class="l b">프론트플레인</text><text x="160" y="132" class="sm">빛을 다루는 층</text>
<text x="60" y="276" class="l b">백플레인</text><text x="132" y="276" class="sm">실리콘 칩. 반도체 공장(파운드리)에서 만든다.</text>
<line x1="424" y1="167" x2="468" y2="167" stroke="#64748b" stroke-width="1.2"/>
<line x1="468" y1="100" x2="468" y2="330" stroke="#64748b" stroke-width="1.2"/>
<text x="484" y="96" class="l b">프론트플레인을 무엇으로 만드느냐에 따라</text>
<text x="484" y="116" class="l b">종류가 갈린다</text>
<line x1="468" y1="160" x2="484" y2="160" stroke="#64748b" stroke-width="1.2"/>
<rect x="484" y="138" width="296" height="52" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
<text x="498" y="160" class="l b">LCoS (액정)</text>
<text x="498" y="180" class="sm">스스로 빛을 못 낸다. 외부 광원 빛을 조절한다.</text>
<line x1="468" y1="226" x2="484" y2="226" stroke="#64748b" stroke-width="1.2"/>
<rect x="484" y="204" width="296" height="52" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
<text x="498" y="226" class="l b">microLED (아주 작은 LED)</text>
<text x="498" y="246" class="sm">화소마다 스스로 빛을 낸다.</text>
<line x1="468" y1="292" x2="484" y2="292" stroke="#64748b" stroke-width="1.2"/>
<rect x="484" y="268" width="296" height="72" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
<text x="498" y="292" class="l b" fill="#6b7280">OLEDoS (유기물)</text>
<text x="498" y="314" class="sm">스스로 빛을 내지만 waveguide 를 거치면</text>
<text x="498" y="332" class="sm">어두워서 주로 영상 감상용 안경에 쓰인다.</text>
<text x="400" y="372" text-anchor="middle" class="s">waveguide 형 글래스에서 경쟁하는 것은 LCoS 와 microLED 두 가지다 (7장).</text>
</svg>